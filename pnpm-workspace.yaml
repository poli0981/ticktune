# Native/postinstall builds we explicitly trust. pnpm blocks these by default —
# a supply-chain guard we keep (docs/09 §6), so each entry is a deliberate call:
#   esbuild  — Vite/Astro's bundler; the whole build is dead without it
#   workerd  — the Cloudflare Workers runtime used by `wrangler dev` (docs/10 §3)
#   sharp    — Astro's image pipeline
#
# ffmpeg-static is explicitly DENIED. Its postinstall downloads a prebuilt
# ffmpeg binary from GitHub releases with no checksum, and it used to run on
# every `pnpm install` — including all four CI workflows, none of which ever
# executes ffmpeg. The package is dev-only and only two local scripts need the
# binary (`scripts/make-fixtures.ts`, `scripts/make-demo.ts`); both run the
# package's installer on demand when the binary is missing (see
# `scripts/ensure-ffmpeg.ts`). So the download happens on a developer machine
# that asked for it, never on a runner holding deploy secrets.
allowBuilds:
  esbuild: true
  ffmpeg-static: false
  sharp: true
  workerd: true

# Security overrides inside @lhci/cli's dev-only tree (Lighthouse CI, docs/13 §5).
# @lhci/cli 0.15.1 is the latest release and pins old versions; nothing below
# reaches the shipped bundle. Each was a Dependabot alert the day it landed:
#   tmp      GHSA-ph9p-34f9-6g65 (high), GHSA-52f5-9888-hmc6 (low) — patched
#            in 0.2.6. @lhci/cli's `open` and inquirer's external-editor call
#            `tmp.fileSync`, whose API 0.2 kept.
#   uuid     GHSA-w5hq-g745-h8pq (medium) — patched in 11.1.1. @lhci/cli calls
#            `uuid.v4()`, unchanged, through uuid 11's CommonJS build.
#   js-yaml@3>argparse
#            sprintf-js GHSA-hp3w-g68c-fv3c (medium) has no patched release.
#            argparse 1 is its only path here, and js-yaml 3 loads argparse in
#            its own CLI only, which nothing runs; argparse 2 has no sprintf-js.
#   get-uri>basic-ftp
#            GHSA-c475-qrg2-pj4r (high; pnpm audit had it before Dependabot) —
#            patched in 6.2.1. get-uri reaches FTP only for an `ftp:` PAC URL,
#            which Lighthouse CI here never configures.
#   chromium-bidi>zod
#            GHSA-mrhx-c7xc-m3w5 (high) — patched in 4.6.6, with no 3.x
#            release; chromium-bidi 14 asks for `^3.24.1` and puppeteer-core
#            24.43.1 (the latest 24) pins chromium-bidi 14. puppeteer-core
#            imports chromium-bidi only through a dynamic `import('bidi.js')`
#            for `protocol: 'webDriverBiDi'`, and Lighthouse connects over CDP,
#            so zod 3 leaves the tree the way sprintf-js did.
# extract-zip (GHSA-7pqw-9j4j-h8q3, GHSA-jmr9-qjv8-65gv) has no override: the
# advisories now name 2.0.2 as patched, but npm's newest is still 2.0.1, and
# docs/11 §5 records why it stays.
#
# And one outside @lhci, in Wrangler's dev-only tree (docs/11 §5):
#   miniflare>undici
#            GHSA-xjj6-f33q-929c (high), GHSA-4qv8-2p9j-2685 and
#            GHSA-f72v-6w45-q472 (moderate) — patched in 7.30.1. Wrangler
#            4.152.0 (the latest) still pins miniflare to `undici: 7.29.1`
#            exactly, so there is no bump to prefer; this is a patch within
#            the 7.x line miniflare chose. Drop it once Wrangler ships one.
overrides:
  tmp: ^0.2.6
  uuid: ^11.1.1
  'js-yaml@3>argparse': ^2.0.1
  'get-uri>basic-ftp': ^6.2.1
  'chromium-bidi>zod': ^4.6.6
  'miniflare>undici': ^7.30.1
