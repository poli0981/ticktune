# Native/postinstall builds we explicitly trust. pnpm blocks these by default —
# a supply-chain guard we keep (docs/09 §6), so each entry is a deliberate call:
#   esbuild  — Vite/Astro's bundler; the whole build is dead without it
#   workerd  — the Cloudflare Workers runtime used by `wrangler dev` (docs/10 §3)
#   sharp    — Astro's image pipeline
#
# ffmpeg-static is explicitly DENIED. Its postinstall downloads a prebuilt
# ffmpeg binary from GitHub releases with no checksum, and it used to run on
# every `pnpm install` — including all four CI workflows, none of which ever
# executes ffmpeg. The package is dev-only and only two local scripts need the
# binary (`scripts/make-fixtures.ts`, `scripts/make-demo.ts`); both run the
# package's installer on demand when the binary is missing (see
# `scripts/ensure-ffmpeg.ts`). So the download happens on a developer machine
# that asked for it, never on a runner holding deploy secrets.
allowBuilds:
  esbuild: true
  ffmpeg-static: false
  sharp: true
  workerd: true

# Security override inside @lhci/cli's dev-only tree (Lighthouse CI, docs/13 §5).
# Nothing below reaches the shipped bundle.
#   get-uri>basic-ftp
#            GHSA-c475-qrg2-pj4r (high; pnpm audit had it before Dependabot) —
#            patched in 6.2.1. get-uri reaches FTP only for an `ftp:` PAC URL,
#            which Lighthouse CI here never configures. @lhci/cli 0.16.0 still
#            asks for proxy-agent 6, whose get-uri asks for basic-ftp 5.
#
# @lhci/cli 0.16.0 (Lighthouse 13, 2026-11-10) retired the other four — `tmp`,
# `uuid`, `js-yaml@3>argparse` and `chromium-bidi>zod` — and took extract-zip
# out of the tree: with the overrides removed, `pnpm audit` names none of them
# (docs/11 §5).
# No override, and docs/11 §5 records why each stays:
#   deepmerge (GHSA-gcqx-w48m-w2h4, low) — through @sveltejs/vite-plugin-svelte,
#            which merges its own build config with it; npm's newest is 4.3.1,
#            the last vulnerable one, so there is nothing to move to.
#   minimatch (GHSA-g3hv-75wg-m249, moderate) — through eslint and
#            @eslint/config-array, which ask for `^10.2.6` while the fix exists
#            only in 11.0.1+; an override would cross the major ESLint calls on
#            every lint, and the patterns it parses are our own config's globs.
#
# Wrangler's `miniflare>undici ^7.30.1` override went in v2.1: Wrangler 4.156.0
# ships a miniflare that asks for undici 7.30.1 itself, as its note asked.
overrides:
  'get-uri>basic-ftp': ^6.2.1
