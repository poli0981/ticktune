# Qodana — docs/14 §1. Read by .github/workflows/qodana.yml.
#
# qodana-js is JetBrains' JavaScript/TypeScript linter (WebStorm's inspections);
# it needs the Ultimate licence that QODANA_TOKEN carries. Native mode, no
# Docker image: the workflow installs node_modules on the runner first, with
# install scripts off, and runs `astro sync` so `.astro/` types resolve.
version: '1.0'
linter: qodana-js
withinDocker: false

profile:
  name: qodana.recommended

# Svelte and Astro are outside this analysis, measured 2026-11-19: qodana-js
# bundles Vue.js but neither of them, so the 26 components and every page are
# indexed as plain text; and adding JetBrains' own plugins under `plugins:`
# (dev.blachut.svelte.lang, org.jetbrains.plugins.astro) stops the scan —
# "This feature is not available in your ULTIMATE plan", then "Failed to
# install plugins". svelte-check, astro check, eslint-plugin-svelte and
# SonarQube Cloud cover those files; this covers the TypeScript.

# What is not code, or not ours — the same set sonar-project.properties keeps
# out of the analysis: build and coverage output, the local audio corpus,
# static assets, prose, generated types, test fixtures and screenshots.
exclude:
  - name: All
    paths:
      - dist
      - coverage
      - test
      - public
      - docs
      - legal
      - src/assets
      - .astro
      - tests/e2e/fixtures
      - tests/visual/__screenshots__
      - pnpm-lock.yaml
      # The spike harnesses stay exactly as they measured (docs/15): S4b's
      # module shipped unchanged as tt-crossfade.ts, and the rest are records.
      - src/spike
  # Inspections switched off after the first run (2026-11-19), each because it
  # contradicts a rule of this repository rather than finding a defect:
  #
  # Doc comments here are prose, written for the reader of the code; `@param`
  # appears only where a parameter needs saying. "Every parameter described"
  # is not the convention — 19 of the first run's 48 findings. (The one that
  # named a parameter the function no longer has was a real defect, and fixed.)
  - name: JSCommentMatchesSignature
  # Relative imports are what all three programs resolve alike: the app, the
  # Worker (tsconfig.worker.json has no path aliases) and the scripts. The
  # `@app/*` and `@lib/*` aliases in tsconfig.json have no users, so rewriting
  # an import to one would start a second style, not finish one. 17 findings.
  - name: ES6PreferShortImport

# Clean since v2.3.0 (2026-11-19, docs/14 §1): any new finding turns this
# workflow red, so it is fixed — or switched off above with its reason — never
# left standing to be ignored. Still not a required check.
failureConditions:
  severityThresholds:
    any: 0
