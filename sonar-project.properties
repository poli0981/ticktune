# SonarQube Cloud — CI-based analysis (docs/14 §1).
#
# Read by the scanner in ci.yml's `sonar` job. Until 2026-10-23 this file was
# `.sonarcloud.properties` and scoped Automatic Analysis, which could neither
# import coverage nor install node_modules: the quality gate's coverage
# condition was never evaluated, and the TypeScript analysis guessed at every
# imported type. `sonar.projectVersion` is passed by the workflow — it is
# package.json's version, so the "previous version" new-code period resets at
# each release instead of running from the first analysis forever.
sonar.organization=poli0981
sonar.projectKey=poli0981_ticktune

# Without a scope every directory was analysed as main code, so test helpers
# were held to production rules and counted toward production ratings, and
# generated output could be picked up. Shipped/built code is under src/ and
# worker/; scripts/ are build tooling that runs in CI and still deserves review.
# .github/ is the CI itself — the workflows run next to the deploy token, and
# the GitHub Actions rules (githubactions:S7637 asked for the SHA pins) only
# read what is in scope. Scoping Automatic Analysis had quietly dropped it.
sonar.sources=src,worker,scripts,astro.config.mjs,.github
sonar.tests=tests
sonar.test.inclusions=tests/**

# Never analyse build output, coverage, the local-only audio corpus, binary
# fixtures, or prose. docs/ and legal/ are reviewed by humans, not linters.
# The scanner indexes every file in scope, language or not, and reads each one
# as UTF-8: the landing's demo media and the tests' audio, pictures and visual
# baselines put 31 encoding warnings in every log until they were listed here.
sonar.exclusions=dist/**,coverage/**,test/**,public/**,docs/**,legal/**,**/*.json,src/assets/**
sonar.test.exclusions=tests/e2e/fixtures/**,tests/visual/__screenshots__/**
sonar.sourceEncoding=UTF-8

# The two programs `pnpm check` type-checks. Left to discovery, worker/ is an
# orphan file analysed without @cloudflare/workers-types.
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.worker.json

# Coverage: Vitest's LCOV report, written by `pnpm test` in the `ci` job.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# What unit coverage does not measure — the same carve-outs as vitest.config.ts
# (docs/13 §1; tests/unit/tt-coverage-scope.test.ts keeps the lists in step).
# A file missing from the report counts as 0%, not as unknown, so each one is
# named, with where it IS verified:
# - engine *-driver.ts / *.worker.ts: browser wiring (Worker, AudioContext, the
#   YouTube iframe, Wake Lock); Playwright and the spikes run them (13 §1).
# - src/app/mount.ts: the island entry; every E2E spec mounts it.
# - src/spike/**: measurement harnesses, run by hand in real browsers (15).
# - scripts/**, astro.config.mjs, src/content.config.ts: build and CI tooling;
#   every `pnpm build` and every CI run executes it.
sonar.coverage.exclusions=src/app/engine/**/*.worker.ts,src/app/engine/**/*-driver.ts,src/app/mount.ts,src/spike/**,src/content.config.ts,scripts/**,astro.config.mjs

# Translation dictionaries are parallel by construction: the same keys in the
# same order, with only the string values differing (vi.ts is typed against
# `typeof en`, so parity is a compile error — docs/08 §1). Copy/paste detection
# sees that as one long duplicated block and charged every new key to the
# duplication gate (7.3% on #71, for three footer labels).
sonar.cpd.exclusions=src/i18n/static/**
