name: Quality

# docs/13 §3, §5 (v2.0) — two gates that are informative before they are
# required: neither is in the `main` ruleset until a few weeks of runs show it
# is stable (docs/14 §1).
on:
  pull_request:
    branches: [main]

# Explicit, never inherited (docs/14 — the GitHub inheritance bug), and granted
# per job rather than here (docs/14 §2).
permissions: {}

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lighthouse on the static pages, desktop preset, the analytics beacon blocked
  # so CI never counts a visit. Thresholds in lighthouserc.json: performance
  # ≥ 0.90, accessibility / best practices / SEO ≥ 0.95. The reports stay here,
  # as an artifact — nothing is uploaded to Google's public storage.
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI
        run: pnpm lhci
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: lhci-report/
          retention-days: 14

  # Screenshots of every screen in both themes, compared against the baselines
  # made in this SAME image (pnpm test:visual:docker). Pinned by digest: a
  # different image renders different pixels and every comparison would lie.
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The 1.65 image's Node ships no corepack (Node 25 dropped it), so pnpm
      # is installed at the version `packageManager` names — the same line as
      # `scripts/visual-docker.ts`.
      - run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compare screenshots
        run: pnpm test:visual
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-diffs
          path: playwright-report/
          retention-days: 14
