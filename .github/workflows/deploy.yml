name: Deploy

# THE production path — docs/14 §5. Production changes only when a signed
# `vX.Y.Z` tag is pushed. Cloudflare Workers Builds is upload-only
# (`wrangler versions upload` for every branch, including main), so nothing else
# can deploy; before v1.1 it deployed every pushed branch at 100% and raced this
# workflow on tags (docs/16).
#
# No `workflow_dispatch`: it let any branch be deployed by hand, after which the
# release step failed — with production already changed. To redeploy a release,
# re-run this workflow's run for that tag from the Actions tab.
on:
  push:
    tags: ['v*']

# Explicit, never inherited — the known GitHub inheritance bug (docs/14 §2).
# Read-only by default; only the `release` job widens it.
permissions:
  contents: read

# One production deploy at a time, and never cancel one that has started.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the ancestry check below needs main.
          fetch-depth: 0
          persist-credentials: false

      # 🔴 The signature IS the release gate. GitHub's rebase-merge leaves
      # unsigned commits on main (docs/14 §3), so the tag is the only signed
      # artifact of a release — and `gh release create --verify-tag` below only
      # checks that the tag EXISTS. This checks who signed it, against the keys
      # GitHub publishes for the owner's account.
      - name: Tag is signed by the owner
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          curl -fsSL https://github.com/poli0981.gpg | gpg --batch --import
          git verify-tag "${GITHUB_REF_NAME}"

      # A tag on anything but main's history would deploy code that never
      # passed review or CI on main.
      - name: Tag points at a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same gates as ci.yml, on the exact commit being released.
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm knip
      - run: pnpm build
      - run: pnpm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm build` also runs scripts/inject-csp-hash.ts, which rewrites the
      # mobile-gate hash into dist/_headers and FAILS if the site does not have
      # exactly one distinct inline script (docs/10 §7).
      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        run: pnpm wrangler deploy
        env:
          # Token scope must be exactly: Account → Workers Scripts: Edit, and
          # Zone → Workers Routes: Edit (docs/14 §4). A broader token in a
          # public repo's secrets is the single worst exposure in this project.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # docs/14 §5 — publishes the one artifact a release needs: a GitHub Release
  # carrying the signed tag's own hand-written message. The only job that can
  # write to the repository, and it runs no build tooling at all.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
