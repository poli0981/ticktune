name: CI

on:
  pull_request:
  push:
    branches: [main]

# Explicit, never inherited. Reusable-workflow callers silently receive
# `permissions: none` under a known GitHub inheritance bug, so every workflow in
# this repo declares its own block (docs/14 §2-3, CLAUDE.md).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (SonarCloud githubactions:S7637);
      # Dependabot bumps the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so the token has no reason to stay on disk.
          persist-credentials: false

      # Runs before install: it needs nothing but git, and if the corpus ever
      # lands in a commit we want to know immediately, not 3 minutes later.
      # .gitignore cannot stop `git add -f`; this can (see the script header).
      - name: Guard against the audio corpus
        run: node scripts/guard-no-corpus.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Typecheck (astro check + svelte-check)
        run: pnpm check

      # docs/12 §5 makes this a build-failing gate, not advisory.
      - name: Unused code (knip)
        run: pnpm knip

      # docs/13 §8 — resolve every `NN §M` citation against the target file's
      # real sections. The suite carries ~700 of them and they rot silently:
      # renumbering a section invalidates every citation of it elsewhere and
      # nothing fails. Runs here rather than in audit.yml, which only triggers
      # on lockfile changes and would never see a docs-only PR.
      - name: Doc cross-references
        run: node scripts/check-doc-refs.ts

      # BUILD BEFORE TEST, and the order is load-bearing (docs/13 §1).
      # tests/unit/tt-csp-assets.test.ts and tt-notices.test.ts read dist/ —
      # the CSS the browser receives and the generated notices — and skip when
      # it is absent. With the old test-then-build order they were skipped on
      # every CI run since they were written; in CI a missing dist/ is now a
      # failure, not a skip.
      - name: Build
        run: pnpm build

      - name: Unit + component tests
        run: pnpm test
