name: Audit

on:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

# Explicit, and granted per job rather than here (docs/14 §2).
permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # docs/09 §6 / docs/11 §5: fail on high or critical in what SHIPS.
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level high

      # The dev toolchain is not shipped to users, but it is not harmless either:
      # wrangler, miniflare and sharp run inside the deploy job next to the
      # Cloudflare API token (commit b7f8d3e fixed a vulnerable sharp pinned by
      # miniflare that the prod-only audit could never see). Critical only, so a
      # moderate advisory in a test runner does not block a release by itself —
      # Dependabot alerts still surface those.
      - name: pnpm audit (all, critical)
        run: pnpm audit --audit-level critical
