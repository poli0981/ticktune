# SonarCloud Automatic Analysis — scope (docs/14 §1).
#
# Without this file every directory was analysed as main code, so test helpers
# were held to production rules and counted toward production ratings, and
# generated output could be picked up. Shipped/built code is under src/ and
# worker/; scripts/ are build tooling that runs in CI and still deserves review.
sonar.sources=src,worker,scripts,astro.config.mjs
sonar.tests=tests
sonar.test.inclusions=tests/**

# Never analyse build output, coverage, the local-only audio corpus, binary
# fixtures, or prose. docs/ and legal/ are reviewed by humans, not linters.
sonar.exclusions=dist/**,coverage/**,test/**,public/**,docs/**,legal/**,**/*.json
sonar.sourceEncoding=UTF-8
